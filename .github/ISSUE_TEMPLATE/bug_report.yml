name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste API keys or your config.json here. Issues are public.**
  - type: input
    id: version
    attributes:
      label: VBWrite version
      description: Settings → About
      placeholder: "1.3.2"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: [Windows 11, Windows 10]
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI provider
      options: [Groq, Gemini, OpenAI, Anthropic (Claude), Custom, Not related]
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message or screenshot
      description: Copy the exact message, or drag a screenshot here.
